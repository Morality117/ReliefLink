<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat – ReliefLink</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .topbar { flex-shrink: 0; }
      #chatui-root {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      #chat-readonly-overlay {
        display: none;
        position: absolute;
        left: 320px;
        right: 0;
        bottom: 0;
        height: 112px;
        background: rgba(240, 244, 251, 0.96);
        backdrop-filter: blur(2px);
        border-top: 1px solid #d5dcea;
        color: #1a7a38;
        font-size: 0.92rem;
        font-weight: 600;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 12px 20px;
        z-index: 30;
      }
      @media (max-width: 760px) {
        #chat-readonly-overlay { left: 0; }
      }
      nc-chat-ui-app-provider {
        display: block;
        height: 100%;
      }
      #chat-status {
        display: none;
        flex-shrink: 0;
        margin: 0;
        padding: 10px 20px;
        background: #fff4d6;
        color: #7a5200;
        font-size: 0.9rem;
        text-align: center;
        font-weight: 500;
      }
      #chat-status.bad { background: #ffe0e3; color: #b81f2f; }
      #chat-paused-banner {
        display: none;
        flex-shrink: 0;
        margin: 0;
        padding: 10px 20px;
        background: #e8f8ed;
        color: #1a7a38;
        border-bottom: 1px solid #c3ebd0;
        font-size: 0.88rem;
        font-weight: 600;
        text-align: center;
      }
      .partner-pill {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.28);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      /* Demo chat (mock mode) */
      .mock-chat { display: flex; flex-direction: column; height: 100%; max-width: 860px; margin: 0 auto; background: #fff; box-shadow: 0 0 30px rgba(30, 60, 120, 0.1); }
      .mock-header { padding: 14px 20px; font-weight: 700; border-bottom: 1px solid #d5dcea; }
      .mock-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: #f4f7fd; }
      .bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
      .bubble.me { align-self: flex-end; background: #0c2f6b; color: #fff; border-bottom-right-radius: 4px; }
      .bubble.them { align-self: flex-start; background: #fff; border: 1px solid #d5dcea; border-bottom-left-radius: 4px; }
      .bubble small { display: block; opacity: 0.7; font-size: 0.75rem; margin-top: 4px; }
      .bubble a { color: inherit; text-decoration: underline; }
      .mock-form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #d5dcea; flex-wrap: wrap; }
      .mock-form input { flex: 1; min-width: 160px; padding: 12px 14px; border: 1px solid #cfd8e8; border-radius: 10px; font-size: 1rem; font-family: inherit; }
    </style>
  </head>
  <body>

    <div class="topbar">
      <div class="brand">Relief<span>Link</span> Chat</div>
      <div class="user-area">
        <span class="partner-pill" id="chat-partner-banner" hidden></span>
        <span id="user-name"></span>
        <a id="back-link" href="#">← Back to dashboard</a>
        <a id="logout" href="../LoginSignupPage/login.html">Log out</a>
      </div>
    </div>

    <p id="chat-status"></p>
    <p id="chat-paused-banner"></p>
    <div id="chatui-root"><div id="chat-readonly-overlay">This task is resolved. Chat history is read-only.</div></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="../js/api.js"></script>
    <script type="module" src="chat.js"></script>
  </body>
</html>
