<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat – ReliefLink</title>
    <link rel="stylesheet" href="dashboard.css">
    <style>
      body { margin: 0; }
      #chatui-root { height: calc(100vh - 64px); }
      #chat-status {
        display: none; margin: 0; padding: 12px 24px; background: #fff4d6; color: #7a5200;
        font-size: 0.92rem; text-align: center; font-weight: 500;
      }
      #chat-status.bad { background: #ffe0e3; color: #b81f2f; }
      .partner-pill {
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid rgba(255, 255, 255, 0.28);
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      /* Demo chat (mock mode) */
      .mock-chat { display: flex; flex-direction: column; height: 100%; max-width: 860px; margin: 0 auto; background: #fff; box-shadow: 0 0 30px rgba(30, 60, 120, 0.1); }
      .mock-header { padding: 14px 20px; font-weight: 700; border-bottom: 1px solid #d5dcea; }
      .mock-messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; background: #f4f7fd; }
      .bubble { max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
      .bubble.me { align-self: flex-end; background: #0c2f6b; color: #fff; border-bottom-right-radius: 4px; }
      .bubble.them { align-self: flex-start; background: #fff; border: 1px solid #d5dcea; border-bottom-left-radius: 4px; }
      .bubble small { display: block; opacity: 0.7; font-size: 0.75rem; margin-top: 4px; }
      .bubble a { color: inherit; text-decoration: underline; }
      .mock-form { display: flex; gap: 10px; padding: 14px; border-top: 1px solid #d5dcea; flex-wrap: wrap; }
      .mock-form input { flex: 1; min-width: 160px; padding: 12px 14px; border: 1px solid #cfd8e8; border-radius: 10px; font-size: 1rem; font-family: inherit; }
    </style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c2f6b'/%3E%3Cpath d='M32 14c-8.3 0-15 6.7-15 15 0 10.5 15 23 15 23s15-12.5 15-23c0-8.3-6.7-15-15-15z' fill='%23f7931e'/%3E%3Ccircle cx='32' cy='29' r='5.5' fill='%23ffffff'/%3E%3C/svg%3E">
  </head>
  <body>

    <div class="topbar">
      <div class="brand">Relief<span>Link</span> Chat</div>
      <div class="user-area">
        <span class="partner-pill" id="chat-partner-banner" hidden></span>
        <span id="user-name"></span>
        <a id="back-link" href="#">← Back to dashboard</a>
        <a id="logout" href="../LoginSignupPage/login.html">Log out</a>
      </div>
    </div>

    <p id="chat-status"></p>
    <div id="chatui-root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="../js/api.js"></script>
    <script type="module" src="chat.js"></script>
  </body>
</html>
