<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Help</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>

    <div class="topbar">
      <div class="brand">Relief<span>Link</span></div>
      <div class="user-area">
        <span id="user-name"></span>
        <a id="logout" href="../LoginSignupPage/login.html">Log out</a>
      </div>
    </div>

    <div class="page">
      <a class="back-link" href="citizen-dashboard.html">← Back to dashboard</a>
      <h2>Request Help</h2>

      <form class="form-card" id="request-form">

        <label class="title" for="type">What do you need?</label>
        <select id="type" name="type" required>
          <option value="">Choose one</option>
          <option value="Rescue">Rescue / evacuation</option>
          <option value="Food">Food</option>
          <option value="Water">Drinking water</option>
          <option value="Medical">Medical help</option>
          <option value="Other">Other (shelter, supplies...)</option>
        </select>

        <label class="title" for="people">How many people need help?</label>
        <input id="people" name="people" type="number" min="1" value="1" required>

                <label class="title" for="description">Describe the situation</label>
        <textarea id="description" name="description" required placeholder="For example: water level is rising, two elderly people on the second floor"></textarea>

        <label class="title" for="location">Your location</label>
        <div class="location-row">
          <input id="location" name="location" type="text" placeholder="Address or landmark">
          <button type="button" class="btn outline" id="locate-btn">Use my current location</button>
        </div>
        <p class="hint" id="location-hint"></p>
        <p class="hint" id="coords"></p>

        <!-- Tap the map or drag the pin to set the exact spot -->
        <p class="hint">Or tap the map to drop a pin. You can drag the pin to adjust it.</p>
        <div id="map"></div>

        <p class="error" id="error-message" style="color:#d62839;"></p>
        <button type="submit" class="btn primary">Send Request</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="../js/api.js"></script>
    <script>
      // The chosen location (filled in by GPS or by tapping the map)
      let latitude = null;
      let longitude = null;
      let accuracy = null;      // metres; stays null when the user places the pin by hand

      const hint = document.querySelector("#location-hint");
      const coords = document.querySelector("#coords");
      const box = document.querySelector("#location");

      // ----- Map (Google Maps) -----
      let map = null;
      let marker = null;

      async function initMap() {
        try {
          await loadGoogleMaps();
        } catch (err) {
          hint.textContent = err.message + ". You can still type your address.";
          return;
        }
        map = new google.maps.Map(document.querySelector("#map"), {
          center: { lat: 22.5726, lng: 88.3639 },   // starting view: change to your area
          zoom: 11,
          mapTypeControl: false,
          streetViewControl: false,
        });
        // Tapping the map drops the pin there
        map.addListener("click", (e) => setLocation(e.latLng.lat(), e.latLng.lng(), null));
        if (latitude !== null) placeMarker(latitude, longitude);   // in case the GPS answered first
      }

      // Put the pin on the map (or move it if it's already there)
      function placeMarker(lat, lng) {
        if (!map) return;
        const position = { lat: lat, lng: lng };
        if (marker) {
          marker.setPosition(position);
        } else {
          marker = new google.maps.Marker({ position: position, map: map, draggable: true });
          // when the user finishes dragging the pin, use the new spot
          marker.addListener("dragend", () => {
            const p = marker.getPosition();
            setLocation(p.lat(), p.lng(), null);
          });
        }
      }

      // One function that handles a new location, wherever it came from
      async function setLocation(lat, lng, acc) {
        latitude = lat;
        longitude = lng;
        accuracy = acc;
        placeMarker(lat, lng);

        // Show the coordinates straight away
        coords.innerHTML =
          "Coordinates: " + lat.toFixed(5) + ", " + lng.toFixed(5) +
          (acc ? " (accurate to about " + acc + " m)" : " (pinned on the map)") + " · " +
          '<a href="https://www.google.com/maps?q=' + lat + ',' + lng +
          '" target="_blank">Check on map</a>';

        // Then look up the address
        hint.textContent = "Finding your address...";
        try {
          const url = "https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lng;
          const res = await fetch(url);
          const data = await res.json();
          box.value = data.display_name;
          hint.textContent = "Address found. It may not be exact, so please correct it if needed.";
        } catch (err) {
          hint.textContent = "Couldn't find the address. Please type it.";
        }
      }

      initMap();   // load Google Maps and draw the map

      // "Use my current location" button
      document.querySelector("#locate-btn").addEventListener("click", () => {
        hint.textContent = "Getting your location...";
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            if (map) { map.setCenter({ lat: lat, lng: lng }); map.setZoom(16); }   // zoom the map to the user
            setLocation(lat, lng, Math.round(position.coords.accuracy));
          },
          () => {
            hint.textContent = "Couldn't get your location. Tap the map or type your address.";
          }
        );
      });

      // Only residents (citizens) may open this page
      requireRole("resident");

      const errorBox = document.querySelector("#error-message");

      // Form submit: check the location, then send the request
      document.querySelector("#request-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        errorBox.textContent = "";

        // A request without a location can't be shown on the volunteer map
        if (latitude === null) {
          errorBox.textContent = "Please set your location: use the button or tap the map.";
          return;
        }

        const button = e.target.querySelector("button[type='submit']");
        button.disabled = true;
        try {
          // The backend stores a category, a description and a position.
          // So the number of people and the address go into the description text.
          let text = document.querySelector("#description").value.trim();
          const people = Number(document.querySelector("#people").value);
          const address = document.querySelector("#location").value.trim();
          if (people > 1) text += "\nPeople needing help: " + people;
          if (address) text += "\nAddress: " + address;

          await api.createRequest({
            category: document.querySelector("#type").value,
            description: text,
            latitude: latitude,
            longitude: longitude,
          });
          window.location.href = "citizen-dashboard.html";
        } catch (err) {
          errorBox.textContent = err.message;
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
