<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Volunteer Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
  </head>
  <body>

    <div class="topbar">
      <div class="brand">Relief<span>Link</span></div>
      <div class="user-area">
        <span id="user-name"></span>
        <a id="logout" href="../LoginSignupPage/login.html">Log out</a>
      </div>
    </div>

    <div class="page">

      <div class="hero">
        <h1>People who need help</h1>
        <p>Accept a request to take it on, then keep its status up to date.</p>
      </div>

      <div class="stats">
        <div class="stat"><strong id="count-available">0</strong><span>Waiting for a volunteer</span></div>
        <div class="stat"><strong id="count-active">0</strong><span>My active tasks</span></div>
        <div class="stat"><strong id="count-resolved">0</strong><span>Resolved by me</span></div>
      </div>

      <div id="map"></div>
      <p class="error" id="error-message"></p>

      <h2>Available Requests</h2>
      <div id="available-list"></div>

      <h2>My Tasks</h2>
      <div id="task-list"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.js"></script>
    <script src="../js/api.js"></script>
    <script>
      const me = requireRole("volunteer");
      const errorBox = document.querySelector("#error-message");

      let available = [];
      let tasks = [];

      // ----- Map (Google Maps) -----
      let map = null;
      let infoWindow = null;
      let markers = [];
      let markersById = {};

      const mapReady = (async () => {
        try {
          await loadGoogleMaps();
          map = new google.maps.Map(document.querySelector("#map"), {
            center: { lat: 22.5726, lng: 88.3639 },
            zoom: 11,
            mapTypeControl: false,
            streetViewControl: false,
          });
          infoWindow = new google.maps.InfoWindow();
        } catch (err) {
          errorBox.textContent = err.message;
        }
      })();

      function showInfo(marker) {
        infoWindow.setContent(el("div", null, marker.getTitle()));   // el() = safe text, not HTML
        infoWindow.open(map, marker);
      }

      function focusOn(r) {
        if (!map) return;
        map.panTo({ lat: r.latitude, lng: r.longitude });
        map.setZoom(15);
        if (markersById[r.id]) showInfo(markersById[r.id]);
        document.querySelector("#map").scrollIntoView({ behavior: "smooth" });
      }

      // The part every card has: title, text, status, and "View location"
      function baseCard(r) {
        const card = el("div", "card");
        const info = el("div");
        info.append(el("h3", null, r.category));
        if (r.description) info.append(el("p", null, r.description));
        info.append(el("p", null, "Requested " + timeAgo(r.createdAt)));

        const actions = el("div", "card-actions");
        actions.append(el("span", "tag " + statusClass(r.status), r.status));
        if (r.latitude != null) {
          const view = el("button", "btn outline", "View location");
          view.addEventListener("click", () => focusOn(r));
          actions.append(view);
        }
        card.append(info, actions);
        return { card, actions };
      }

      // Run an action, then reload. Show any error.
      function run(button, work) {
        button.addEventListener("click", async () => {
          button.disabled = true;
          errorBox.textContent = "";
          try { await work(); await load(); }
          catch (err) { errorBox.textContent = err.message; button.disabled = false; }
        });
      }

      function render() {
        const availableList = document.querySelector("#available-list");
        const taskList = document.querySelector("#task-list");
        availableList.innerHTML = "";
        taskList.innerHTML = "";
        markers.forEach((m) => m.setMap(null));
        markers = [];
        markersById = {};

        if (available.length === 0) availableList.append(el("p", "empty", "No requests are waiting right now."));
        available.forEach((r) => {
          const { card, actions } = baseCard(r);
          const accept = el("button", "btn primary", "Accept");
          run(accept, () => api.acceptRequest(r.id));
          actions.append(accept);
          availableList.append(card);
        });

        if (tasks.length === 0) taskList.append(el("p", "empty", "You haven't accepted any requests yet."));
        tasks.forEach((t) => {
          const { card, actions } = baseCard(t);
          if (t.status === "Assigned" || t.status === "In Progress") {
            const chat = el("a", "btn outline", "Open Chat");
            chat.href = "chat.html?request=" + encodeURIComponent(t.id);    // chat page comes later
            actions.append(chat);

            const next = t.status === "Assigned" ? "In Progress" : "Resolved";
            const action = el("button", "btn primary", t.status === "Assigned" ? "Start task" : "Mark resolved");
            run(action, () => api.updateTaskStatus(t.assignmentId, next));
            actions.append(action);
          }
          taskList.append(card);
        });

        // map markers for everything shown
        if (map) [...available, ...tasks].forEach((r) => {
          if (r.latitude == null) return;
          const marker = new google.maps.Marker({
            position: { lat: r.latitude, lng: r.longitude },
            map: map,
            title: r.category + " (" + r.status + ")",
          });
          marker.addListener("click", () => showInfo(marker));
          markers.push(marker);
          markersById[r.id] = marker;
        });

        document.querySelector("#count-available").textContent = available.length;
        document.querySelector("#count-active").textContent = tasks.filter((t) => t.status === "Assigned" || t.status === "In Progress").length;
        document.querySelector("#count-resolved").textContent = tasks.filter((t) => t.status === "Resolved").length;
      }

      async function load() {
        try {
          [available, tasks] = await Promise.all([api.getAvailableRequests(), api.getMyTasks()]);
          await mapReady;
          render();
        } catch (err) {
          errorBox.textContent = err.message;
        }
      }

      if (me) load().then(() => {
        if (!map) return;
        const bounds = new google.maps.LatLngBounds();
        let count = 0;
        [...available, ...tasks].forEach((r) => {
          if (r.latitude != null) { bounds.extend({ lat: r.latitude, lng: r.longitude }); count++; }
        });
        if (count > 0) {
          map.fitBounds(bounds, 40);
          // don't zoom in too far when there is only one point
          google.maps.event.addListenerOnce(map, "idle", () => { if (map.getZoom() > 14) map.setZoom(14); });
        }
      });
    </script>
  </body>
</html>
